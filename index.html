:root{--bg:#fff;--fg:#000;--muted:#333;color-scheme:light;--font:Arial,'Helvetica Neue',Helvetica,sans-serif}

.opt.radio .l{border-radius:50%}
.opt.check .l{border-radius:4px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-width:4px;padding:14px 12px}

.opt.ok{background:var(--fg);color:var(--bg)}

.opt.bad{border-style:dashed;border-width:4px;padding:14px 12px;text-decoration:line-through}
.opt.bad .l{box-shadow:none;background:var(--bg);color:var(--fg)}
.opt[disabled]{cursor:default}
.verdict{border:4px solid var(--fg);border-radius:8px;padding:12px 14px;font-weight:700;font-size:1.1rem}
.verdict small{display:block;font-weight:400;font-size:.9rem;margin-top:4px}

var app=document.getElementById('app');
var st=null;

function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function same(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>-1})}

function home(){
  st=null; app.innerHTML='';
  app.appendChild(el('<h1>Санэпидрежим</h1>'));
  app.appendChild(el('<p class="sub">41 вопрос</p>'));
  var t2=el('<button class="cta">Начать по порядку</button>');
  t2.onclick=function(){start(5,order(5))};
  app.appendChild(t2);
  var t2m=el('<button class="cta alt">Вперемешку</button>');
  t2m.onclick=function(){start(5,shuffle(order(5)))};
  app.appendChild(t2m);
}

function order(v){return DATA[v].map(function(_,i){return i})}
function shuffle(ids){
  for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}
  return ids;
}

function qOf(id){
  if(st.v) return DATA[st.v][id];
  var p=String(id).split(':');return DATA[p[0]][+p[1]];
}

function start(v,ids){
  st={v:v,ids:ids,i:0,res:[],sel:[],done:false};
  render();
}

function render(){
  var q=qOf(st.ids[st.i]), multi=q.a.length>1, n=st.ids.length;
  app.innerHTML='';
  var top=el('<div class="top"><button class="back">← Меню</button><div class="bar"><i></i></div><span class="cnt">'+(st.i+1)+' из '+n+'</span></div>');
  top.querySelector('.back').onclick=home;
  top.querySelector('.bar i').style.width=(st.i/n*100)+'%';
  app.appendChild(top);
  app.appendChild(el('<h2 class="q">'+esc(q.q)+'</h2>'));
  if(multi) app.appendChild(el('<p class="hint">Несколько верных ответов. Отметьте все, что считаете верными.</p>'));
  var box=el('<div class="opts"></div>');
  var btn=el('<button class="cta">Продолжить</button>');
  btn.disabled=true;
  var btns=q.o.map(function(t,k){
    var b=el('<button class="opt '+(multi?'check':'radio')+'"><span class="l"></span><span class="t">'+esc(t)+'</span></button>');
    b.onclick=function(){
      if(st.done) return;
      if(multi){
        var p=st.sel.indexOf(k);
        if(p>-1)st.sel.splice(p,1);else st.sel.push(k);
        b.classList.toggle('sel');
      } else {
        st.sel=[k];
        btns.forEach(function(x){x.classList.remove('sel')});
        b.classList.add('sel');
      }
      btn.disabled=!st.sel.length;
    };
    box.appendChild(b);return b;
  });
  app.appendChild(box);
  btn.onclick=function(){
    if(!st.done){ reveal(q,btns,btn,box); return; }
    if(st.i===st.ids.length-1){result()}else{st.i++;st.sel=[];st.done=false;render()}
  };
  app.appendChild(btn);
  window.scrollTo(0,0);
}

function reveal(q,btns,btn,box){
  st.done=true;
  var ok=same(st.sel,q.a);
  st.res.push(ok);
  btns.forEach(function(b,k){
    b.disabled=true;b.classList.remove('sel');
    var right=q.a.indexOf(k)>-1, chosen=st.sel.indexOf(k)>-1, m=b.querySelector('.l');
    if(right){b.classList.add('ok');m.textContent='✓'}
    else if(chosen){b.classList.add('bad');m.textContent='✗'}
  });
  var det=ok?'':'<small>Верные ответы отмечены чёрным цветом и знаком ✓. Ваш неверный ответ перечёркнут и отмечен знаком ✗.</small>';
  var v=el('<div class="verdict">'+(ok?'✓ Верно':'✗ Неверно')+det+'</div>');
  app.insertBefore(v,btn);
  btn.textContent=(st.i===st.ids.length-1)?'Показать результат':'Далее';
  v.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function result(){
  var n=st.ids.length, c=st.res.filter(Boolean).length;
  app.innerHTML='';
  app.appendChild(el('<div style="display:flex;flex-direction:column;gap:6px"><p class="sub">Результат</p><p class="score">'+c+' из '+n+'</p><p class="sub">'+Math.round(c/n*100)+'% верных ответов</p></div>'));
  var bad=[];
  var ul=el('<ul class="review"></ul>');
  st.ids.forEach(function(id,i){
    var q=qOf(id), ok=st.res[i];
    if(!ok)bad.push(id);
    var ans=q.a.map(function(k){return q.o[k]}).join('; ');
    ul.appendChild(el('<li><b>'+(i+1)+'</b><span class="m">'+(ok?'✓':'✗')+'</span><span class="s">'+esc(q.q)+'<br><span class="hint">'+esc(ans)+'</span></span></li>'));
  });
  if(bad.length){
    var r=el('<button class="cta">Повторить ошибки ('+bad.length+')</button>');
    var v=st.v;
    r.onclick=function(){start(v,bad)};
    app.appendChild(r);
  }
  var again=el('<button class="cta alt">В меню</button>');
  again.onclick=home;
  app.appendChild(again);
  app.appendChild(ul);
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
